<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebMCP Foundry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1214; --panel:#171b1f; --ink:#e6e6e2; --mut:#9aa0a6; --line:#2a3036; --acc:#5cc8a8; --warn:#e0645a; --amber:#e3b04b; --blue:#6aa8ff; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 22px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; letter-spacing:.3px; }
  header .doc { color:var(--mut); font-style:italic; }
  header .spacer { flex:1; }
  header select, header button, .tab { font:inherit; background:#22282e; color:var(--ink); border:1px solid var(--line); border-radius:5px; padding:5px 9px; cursor:pointer; }
  .tab.on { background:var(--acc); color:#06231a; border-color:transparent; }
  #pub { width:100%; font:12px var(--mono); color:var(--mut); }
  main { display:grid; grid-template-columns: 380px 1fr; gap:0; min-height:calc(100vh - 54px); }
  main.flow { grid-template-columns: 1fr; }
  #list { border-right:1px solid var(--line); padding:12px; overflow:auto; }
  #detail { padding:16px 22px; overflow:auto; }
  .cap { border:1px solid var(--line); border-radius:7px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:var(--panel); }
  .cap.sel { outline:2px solid var(--acc); }
  .cap .t { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .cap .name { font-weight:600; }
  .cap .meta { color:var(--mut); font-size:12px; margin-top:4px; }
  .badge { font:11px/1 var(--mono); padding:4px 7px; border-radius:4px; background:#2a3036; color:var(--ink); white-space:nowrap; }
  .st-CANDIDATE { background:#2a3036; } .st-CONTRACTED { background:#2b3a4e; color:#cfe3ff; }
  .st-VERIFIED { background:#1f4a3d; color:#c8f5e4; } .st-LIVE { background:var(--acc); color:#06231a; }
  .st-FAILED { background:#5a2320; color:#ffd6d2; } .st-UNGRADED { background:#4d3f18; color:#ffe9b3; }
  .st-POLICY_BLOCKED { background:#4b2740; color:#ffd2f2; } .st-STALE { background:#5a4a1a; color:#ffe9b3; }
  .st-WITHDRAWN { background:#333; color:#bbb; }
  .v-PASS { color:var(--acc); } .v-FAIL { color:var(--warn); } .v-UNGRADABLE, .v-UNKNOWN, .v-BLOCKED { color:var(--amber); } .v-INVALID { color:#ff8fd8; }
  h2 { font-size:16px; margin:0 0 6px; } h3 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); margin:18px 0 6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:10px 12px; }
  .card .k { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .card .v { font-family:var(--mono); font-size:12.5px; word-break:break-all; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:5px 7px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; }
  code, pre { font-family:var(--mono); font-size:12px; }
  pre { background:#0b0e10; border:1px solid var(--line); border-radius:6px; padding:8px 10px; overflow:auto; max-height:320px; margin:6px 0; white-space:pre-wrap; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .actions button, .step button { font:inherit; padding:6px 10px; border-radius:5px; border:1px solid var(--line); background:#22282e; color:var(--ink); cursor:pointer; }
  .actions button.primary, .step button.primary { background:var(--acc); color:#06231a; border-color:transparent; }
  .actions button.danger { background:var(--warn); color:#fff; border-color:transparent; }
  button:disabled { opacity:.4; cursor:default; }
  .refusal { border-left:3px solid var(--warn); padding:6px 10px; background:#2a1d1c; border-radius:0 6px 6px 0; margin:8px 0; }
  .ok { border-left:3px solid var(--acc); padding:6px 10px; background:#16281f; border-radius:0 6px 6px 0; margin:8px 0; }
  .hist { font-family:var(--mono); font-size:11.5px; color:var(--mut); }
  details summary { cursor:pointer; color:var(--blue); }
  .ledger-row td { font-family:var(--mono); font-size:11.5px; }
  /* judge flow */
  #flow { display:grid; grid-template-columns: 340px 1fr; gap:18px; padding:18px 22px; }
  .step { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel); margin-bottom:7px; }
  .step .n { font:600 13px var(--mono); color:var(--mut); width:18px; }
  .step .title { flex:1; }
  .step .done { color:var(--acc); font-family:var(--mono); font-size:12px; }
  .step.active { outline:2px solid var(--acc); }
  #moment { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 22px; min-height:200px; }
  #moment h2 { font-size:22px; margin:0 0 8px; }
  #moment .big { font:700 34px/1.1 var(--mono); margin:8px 0 12px; }
  #moment .big.fail { color:var(--warn); } #moment .big.ok { color:var(--acc); } #moment .big.warn { color:var(--amber); }
  #moment .lines { font-family:var(--mono); font-size:13px; color:var(--mut); white-space:pre-wrap; }
  #registry { margin-top:14px; }
  #registry .tools { font-family:var(--mono); font-size:13px; }
  #registry .present { color:var(--acc); } #registry .absent { color:var(--mut); }
  .host-native { color:var(--acc); } .host-polyfill, .host-none { color:var(--warn); }
  #webmcp-self { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>WebMCP Foundry</h1>
  <span class="doc">Agents propose. Evidence qualifies. Authority promotes.</span>
  <span class="spacer"></span>
  <span class="tab on" data-view="flow">Judge flow</span>
  <span class="tab" data-view="caps">Capabilities</span>
  <span class="tab" data-view="impact">Blast radius</span>
  <span class="tab" data-view="ledger">Ledger</span>
  <label>acting as
    <select id="who">
      <option value="tok-agent-planner">AGENT planner</option>
      <option value="tok-human-jori">HUMAN jori (owner)</option>
      <option value="tok-human-sam">HUMAN sam (member)</option>
      <option value="tok-system">SYSTEM foundry</option>
    </select>
  </label>
  <button id="discover">Discover</button>
  <button id="rescan">Rescan dependencies</button>
  <span id="webmcp-self"></span>
  <div id="pub"></div>
</header>
<div id="webmcp-status" style="display:none"></div><div id="webmcp-tools" style="display:none"></div>
<main class="flow">
  <div id="flow"></div>
  <div id="list" style="display:none"></div>
  <div id="detail" style="display:none"><p style="color:var(--mut)">Select a capability, or press <b>Discover</b> to scan the app.</p></div>
</main>
<script src="/ui.js"></script>
<script src="/webmcp-bridge.js" data-app="foundry" data-token="tok-agent-planner"></script>
</body>
</html>
